<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>读取 localStorage</title></head>
<body>
<h1>读取存储的 state</h1>
<pre id="output"></pre>
<script>
const STATE_KEY = "fgo-bond-ledger.state.v1";
const stateStr = localStorage.getItem(STATE_KEY);
if (stateStr) {
  const state = JSON.parse(stateStr);
  const result = {
    friendPosition: state.friendPosition,
    countFriendCost: state.countFriendCost,
    slots: state.slots.slice(0, 6).map((slot, i) => {
      const servant = state.servants?.find(s => s.id === slot.servantId);
      const ce = state.craftEssences?.find(c => c.id === slot.ceId);
      return {
        position: i + 1,
        servantId: slot.servantId,
        servantName: servant?.name,
        servantCost: servant?.cost || 0,
        ceId: slot.ceId,
        ceName: ce?.name,
        ceCost: ce?.cost || 0,
        totalCost: (servant?.cost || 0) + (ce?.cost || 0),
        isFriend: (i + 1) === state.friendPosition
      };
    })
  };
  document.getElementById('output').textContent = JSON.stringify(result, null, 2);
} else {
  document.getElementById('output').textContent = '未找到存储的 state';
}
</script>
</body>
</html>
